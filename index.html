<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Играет</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; }
    body { font-family: -apple-system, sans-serif; color: #fff; }

    /* прячем нативный плеер аудио */
    audio { display: none !important; }

    /* стартовая кнопка на весь экран */
    #startScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1db954, #0d5c29);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #startScreen .icon { font-size: 20vh; line-height: 1; }
    #startScreen .hint { font-size: 4vh; margin-top: 3vh; opacity: 0.9; }

    /* экран "играет" на весь экран */
    #playScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, #1db954 0%, #000 70%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 9;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #playScreen .pulse {
      font-size: 22vh;
      line-height: 1;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.15); opacity: 0.8; }
    }
    #playScreen .now { margin-top: 4vh; font-size: 3vh; opacity: 0.7; }
    #playScreen .title { font-size: 4vh; font-weight: bold; margin-top: 1vh; }
    #playScreen .bar {
      width: 70%;
      height: 6px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      margin-top: 5vh;
      overflow: hidden;
    }
    #playScreen .bar > div {
      height: 100%;
      width: 0;
      background: #fff;
      transition: width 0.2s linear;
    }
  </style>
</head>
<body>

  <audio id="audio" src="https://files.catbox.moe/5qydor.mp3" loop preload="auto"></audio>

  <!-- Стартовый экран -->
  <div id="startScreen">
    <div class="icon">▶</div>
    <div class="hint">Нажми в любом месте</div>
  </div>

  <!-- Экран воспроизведения -->
  <div id="playScreen">
    <div class="pulse">🎵</div>
    <div class="now">Сейчас играет</div>
    <div class="title">Твоя песня</div>
    <div class="bar"><div id="progress"></div></div>
    <div class="now" style="margin-top:3vh;font-size:2.5vh;">Нажми, чтобы поставить на паузу</div>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const startScreen = document.getElementById('startScreen');
    const playScreen = document.getElementById('playScreen');
    const progress = document.getElementById('progress');

    // Старт
    startScreen.addEventListener('click', () => {
      audio.play().then(() => {
        startScreen.style.display = 'none';
        playScreen.style.display = 'flex';
      }).catch(err => {
        alert('Ошибка: ' + err.message);
      });
    });

    // Пауза / продолжить
    playScreen.addEventListener('click', () => {
      if (audio.paused) audio.play();
      else audio.pause();
    });

    // Прогресс-бар
    setInterval(() => {
      if (audio.duration) {
        progress.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    }, 200);
  </script>
</body>
</html>
