<style>
:root{--bg:#171b17;--steel:#272d28;--steel2:#333a33;--olive:#4b563e;--sand:#d5c49b;--cream:#eee4cb;--orange:#df8843;--red:#b95345;--green:#a6ba70;--line:#777b5d;--muted:#b8b39c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% -30%,#41483a 0,#242923 52%,#131713 100%);color:var(--cream);font-family:system-ui,"Segoe UI",sans-serif;touch-action:manipulation}button,input{font:inherit}button{color:var(--cream);cursor:pointer}.grain{position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:radial-gradient(#b5ad8d .6px,transparent .8px);background-size:7px 7px}.shell{position:absolute;inset:0;display:flex;align-items:stretch;justify-content:stretch;padding:0}.screen{position:relative;width:100vw;height:100vh;max-height:100%;border:0;border-radius:0;background:radial-gradient(ellipse at 50% -30%,#41483a 0,#242923 52%,#131713 100%);box-shadow:none;overflow:hidden;padding:22px 4vw}.screen:before{display:none}.screen:after{content:"";position:absolute;height:4px;left:0;right:0;top:0;background:repeating-linear-gradient(135deg,var(--orange) 0 12px,#35382d 12px 24px)}.hidden{display:none!important}.top{height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #74785d;padding:0 7px 10px;position:relative;z-index:1}.brand{font-weight:950;letter-spacing:.12em;font-size:14px;color:var(--sand)}.brand b{color:var(--orange)}.pill{font-size:12px;color:#ded6bd;background:#171c17;border:1px solid #687052;padding:7px 12px;border-radius:99px}.body{height:calc(100% - 58px);overflow:auto;padding:24px 10px 8px;position:relative;z-index:1}.hero{display:grid;grid-template-columns:1fr .72fr;gap:24px;align-items:center;min-height:100%}.title{font-size:clamp(34px,6vw,66px);line-height:.98;letter-spacing:-.045em;margin:0 0 12px;text-transform:uppercase;color:#efe5c9}.title span{color:var(--orange)}.sub{color:var(--muted);line-height:1.55;max-width:550px}.tank-art{min-height:180px;display:grid;place-items:center;position:relative}.tank{width:210px;height:130px;background:linear-gradient(#828762,#536149 50%,#343e31);border:7px solid #252a23;border-radius:32px;box-shadow:inset 0 8px #afb28c44,0 20px 25px #0008;position:relative;transform:rotate(-12deg)}.tank:before,.tank:after{content:"";position:absolute;left:7px;right:7px;height:19px;background:repeating-linear-gradient(90deg,#20251f 0 10px,#697053 10px 15px);border:3px solid #20251f;border-radius:12px}.tank:before{top:-17px}.tank:after{bottom:-17px}.turret{position:absolute;width:82px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a7ac82,#4d5942 64%,#2d352b);left:56px;top:22px;border:5px solid #363d30}.barrel{position:absolute;width:99px;height:15px;left:112px;top:50px;border-radius:8px;background:linear-gradient(#96977a,#363c31);border:3px solid #262b24}.card{background:linear-gradient(145deg,#40483a,#272e27);border:1px solid #757a5e;border-radius:13px;padding:18px;box-shadow:0 7px 0 #111510,inset 0 1px #c4bf9166;margin-bottom:12px}.card h2,.card h3{margin:0 0 12px;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:#dfd3ac}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{display:flex;gap:10px;align-items:center}.field{width:100%;background:#171c17;color:var(--cream);border:1px solid #777b5d;border-radius:8px;padding:12px 13px;outline:none}.field:focus{border-color:var(--orange);box-shadow:0 0 0 2px #df884344}.btn{border:1px solid #a6a17a;background:linear-gradient(#69734f,#47513c);border-radius:9px;padding:12px 15px;box-shadow:inset 0 1px #e3dcaa55,0 4px 0 #171b16;font-weight:850;letter-spacing:.045em;text-transform:uppercase;transition:transform .1s,filter .1s}.btn:hover{filter:brightness(1.14)}.btn:active{transform:translateY(3px);box-shadow:inset 0 1px #e3dcaa33,0 1px 0 #171b16}.btn.orange{background:linear-gradient(#eca356,#bd672f);border-color:#f3bb73;color:#241d15}.btn.red{background:linear-gradient(#c56551,#843d36);border-color:#d78768}.btn.gray{background:linear-gradient(#5e6558,#3b4239)}.btn.small{padding:8px 10px;font-size:12px}.wide{width:100%}.status{min-height:22px;color:#efb76d;font-size:13px;margin:9px 2px}.muted{color:var(--muted);font-size:13px}.profile{display:flex;justify-content:space-between;gap:10px;color:#c1c5a1;font-size:13px}.roomlayout{display:grid;grid-template-columns:.85fr 1.15fr;gap:12px;height:100%}.members-list{display:grid;gap:8px}.member,.room-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#20261f;border:1px solid #626950;border-radius:8px;padding:11px;font-size:14px}.badge{color:var(--green);font-weight:800;font-size:11px}.chatlog{height:min(250px,35vh);overflow:auto;background:#1a201a;border:1px solid #626950;border-radius:8px;padding:9px;font-size:13px;line-height:1.45}.chatline{padding:3px 0;border-bottom:1px solid #ffffff0c;overflow-wrap:anywhere}.chatline b{color:#e9a35d}.room-actions{display:flex;gap:9px;margin-top:12px}.room-actions .btn{flex:1}.list{display:grid;gap:8px;max-height:340px;overflow:auto}.footer{font-size:11px;color:#888d73;margin-top:12px}.gamewrap{position:fixed;inset:0;background:#121611;display:flex;align-items:center;justify-content:center;z-index:3}.gameframe{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);background:#35392d;overflow:hidden}.gameframe canvas{width:100%;height:100%;display:block}.gamehud{position:absolute;inset:0;pointer-events:none;display:flex;justify-content:space-between;padding:12px}.gamehud button{pointer-events:auto}.gamehud .pill{pointer-events:auto;cursor:default}.mobile-controls{display:none;position:absolute;inset:auto 0 3vh;align-items:end;justify-content:space-between;padding:0 5vw;pointer-events:none}.joy{width:140px;height:140px;border-radius:50%;border:2px solid #d6d1ab88;background:#172017a6;position:relative;touch-action:none;pointer-events:auto}.joy:after{content:"";position:absolute;width:53px;height:53px;left:41px;top:41px;border-radius:50%;background:linear-gradient(#c2c19b,#66734e);border:2px solid #e4ddae;box-shadow:0 4px 12px #0008}.fire{width:88px;height:88px;border-radius:50%;background:linear-gradient(#eb9860,#b84d38);border:3px solid #eed4a2;box-shadow:0 5px 0 #5d2d25;color:#fff3da;font-weight:900;pointer-events:auto;touch-action:none}.result-overlay{position:fixed;inset:0;z-index:4;display:grid;place-items:center;padding:20px;background:#10140fd9;backdrop-filter:blur(5px)}.result-card{width:min(100%,520px);padding:28px;background:linear-gradient(145deg,#414a3a,#252c25);border:2px solid #d7a45d;border-radius:16px;box-shadow:0 16px 50px #000a;text-align:center}.result-card .pill{display:inline-block}.result-card h1{margin:18px 0 8px;font-size:clamp(30px,7vw,48px);color:#f2e6c9}.result-card p{margin:0 0 22px;color:#c4c5a5;line-height:1.5}.result-card .btn{min-width:200px}.toast{position:fixed;left:50%;top:8%;transform:translateX(-50%);padding:10px 15px;background:#171c17ef;border:1px solid #d69655;border-radius:8px;color:#fff0d2;z-index:5;max-width:90%;text-align:center}@media(max-width:720px){.shell{padding:0}.screen{width:100%;height:100%;border-radius:0;padding:17px 13px}.hero{grid-template-columns:1fr;gap:4px;align-content:start}.tank-art{min-height:110px}.tank{transform:scale(.62) rotate(-12deg)}.grid{grid-template-columns:1fr}.roomlayout{grid-template-columns:1fr;height:auto}.body{padding-top:15px}.room-actions{position:sticky;bottom:0}.card{padding:14px}.title{font-size:44px}.chatlog{height:150px}.mobile-controls{display:flex}.joy{width:125px;height:125px}.joy:after{left:33px;top:33px}.fire{width:79px;height:79px}}
.skin-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.skin-card{min-width:0;background:linear-gradient(150deg,#333c32,#202720);border:1px solid #677253;border-radius:10px;padding:10px;text-align:center}.skin-preview{width:100%;height:105px;display:block;background:radial-gradient(ellipse,#424d3a,#242b24);border:1px solid #59634b;border-radius:7px;margin-bottom:8px}.skin-card h3{font-size:13px;min-height:30px;margin:4px 0;color:#eee4cb}.skin-card .skin-detail{font-size:11px;color:#c1c5a1;min-height:28px}.skin-card .skin-rating{font-size:11px;color:#aeb69a;margin:5px 0}.skin-card .btn{width:100%;padding:8px 4px;font-size:11px}@media(max-width:950px){.skin-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.skin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.skin-preview{height:90px}}
</style></head>
<body><div class="grain"></div><main class="shell" id="lobbyShell"><section class="screen"><header class="top"><div class="brand">СТАЛЬ <b>АРЕНА</b> <span style="color:#8f9672">/ 2D</span></div><div id="connection" class="pill">НЕ В СЕТИ</div></header><div class="body" id="body"></div></section></main><div id="gamewrap" class="gamewrap hidden"><div class="gameframe"><canvas id="arena" width="1280" height="720"></canvas><div class="gamehud"><div class="pill" id="gameInfo">БОЙ</div><button class="btn red small exit" id="exitGame">ВЫЙТИ</button></div><div class="mobile-controls"><div class="joy" id="joy"></div><button class="fire" id="fire">ОГОНЬ</button></div></div></div><div id="resultOverlay" class="result-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="result-card"><div class="pill">КОМНАТА ОСТАЁТСЯ ОТКРЫТОЙ</div><h1 id="resultTitle">МАТЧ ЗАВЕРШЁН</h1><p id="resultSummary">Результат матча</p><button class="btn orange" id="resultReturn">ВЕРНУТЬСЯ В КОМНАТУ</button></div></div><div id="toast" class="toast hidden"></div><script src="client.js?v=2.6.0"></script></body></html>
