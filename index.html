<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>▶ Нажми, чтобы играть</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #111;
      font-family: -apple-system, sans-serif;
    }
    #playBtn {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #1db954, #14833b);
      color: #fff;
      font-size: 8vw;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3vh;
      transition: opacity 0.4s;
    }
    #playBtn:active { background: #0d5c29; }
    #playBtn .icon { font-size: 18vw; line-height: 1; }
    #playBtn .hint { font-size: 4vw; opacity: 0.85; }
    #playBtn.hidden { opacity: 0; pointer-events: none; }

    #player {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    #player .now { font-size: 3vh; opacity: 0.6; margin-bottom: 2vh; }
    #player .title { font-size: 5vh; font-weight: bold; }
    #player .bar {
      width: 80%;
      height: 6px;
      background: #333;
      border-radius: 3px;
      margin-top: 4vh;
      overflow: hidden;
    }
    #player .bar > div {
      height: 100%;
      width: 0;
      background: #1db954;
    }
  </style>
</head>
<body>

  <audio id="audio" src="https://files.catbox.moe/5qydor.mp3" loop></audio>

  <button id="playBtn" onclick="start()">
    <span class="icon">▶</span>
    <span class="hint">Нажми, чтобы включить музыку</span>
  </button>

  <div id="player" style="display:none">
    <div class="now">Сейчас играет</div>
    <div class="title">🎵 Твоя песня</div>
    <div class="bar"><div id="progress"></div></div>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const btn = document.getElementById('playBtn');
    const player = document.getElementById('player');
    const progress = document.getElementById('progress');

    function start() {
      audio.play().then(() => {
        btn.classList.add('hidden');
        setTimeout(() => btn.style.display = 'none', 400);
        player.style.display = 'flex';
      }).catch(err => {
        alert('Не удалось запустить: ' + err.message);
      });
    }

    // прогресс-бар
    setInterval(() => {
      if (audio.duration) {
        progress.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    }, 200);
  </script>
</body>
</html>
